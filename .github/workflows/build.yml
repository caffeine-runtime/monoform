name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a GitHub release with this version (e.g. 2.0.0 or 2.0.0-beta.1). Empty: build only."
        required: false
        default: ""
      skip_macos:
        description: "Leave out the macOS package (e.g. when no macOS runner is available)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  WAILS_VERSION: v2.17.0
  NODE_VERSION: "22"

jobs:
  check:
    name: Checks (types, unit tests, licenses)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System packages (WebKitGTK 4.1)
        # libheif tools: a system HEIC decoder for the conversion test (users install their own; nothing is bundled).
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libheif-examples libheif-plugin-libde265
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Frontend build (embedded into the Go binary)
        working-directory: frontend
        run: npm run build
      - name: Go vet and tests
        run: |
          go vet -tags webkit2_41 ./...
          go test -tags webkit2_41 ./...
      - name: License audit (permissive only)
        run: |
          go build -tags webkit2_41 -o /tmp/hold-it-all .
          python3 scripts/licenses.py /tmp/hold-it-all

  selftest:
    name: In-app self-tests (Linux, Xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gstreamer1.0-plugins-good xvfb openbox qpdf poppler-utils p7zip-full unzip libheif-examples libheif-plugin-libde265 scrot
      - name: Build
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          (cd frontend && npm ci)
          ./scripts/build.sh
      - name: Self-tests
        run: |
          FX=$RUNNER_TEMP/fx
          python3 scripts/fixtures.py "$FX"
          M0=$RUNNER_TEMP/m0 && mkdir -p "$M0" && printf a >"$M0/a.txt" && printf b >"$M0/b.md" && printf c >"$M0/c.txt"
          scripts/selftest.sh m0-setup "$M0" "$RUNNER_TEMP/m0.json"
          scripts/selftest.sh m0-restore "$M0" "$RUNNER_TEMP/m0.json"
          for s in m1 m2 m3 m4 m4b m5 m6 m8 m10 m11 m12 m13 m14 m15 m16 m18 m19 m20 m21 m22 m23 m24 m25 m26 m27 m28 m29 m30 m31 m32 m33 m34 m35 m36 m37 m38 m39 m40; do scripts/selftest.sh "$s" "$FX"; done
          # Quick peek: started with --peek FILE.
          scripts/selftest.sh m32peek "$FX" "" --peek "$FX/diagrams/notes.md"
          HIA_TIMEOUT=400 scripts/selftest.sh m9 "$FX"
          # Pointer maths with a scaled interface (rows and controls at 125 %).
          python3 scripts/fixtures.py "$RUNNER_TEMP/fx125" && echo '{"uiScale":1.25}' > "$RUNNER_TEMP/scale.json" && scripts/selftest.sh m14 "$RUNNER_TEMP/fx125" "$RUNNER_TEMP/scale.json"
          scripts/verify-pdf.sh "$FX"
          scripts/verify-archives.sh "$FX"
          scripts/verify-images.sh "$FX"
          scripts/verify-ocr.sh "$FX"

  build:
    name: Package (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        name: [linux-amd64, windows-amd64, macos-universal]
        # skip_macos drops that job entirely (no macOS runner is requested).
        exclude:
          - name: ${{ inputs.skip_macos == true && 'macos-universal' || 'none' }}
    runs-on: ${{ fromJSON('{"linux-amd64":"ubuntu-24.04","windows-amd64":"windows-latest","macos-universal":"macos-latest"}')[matrix.name] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$INPUT_VERSION"
          if [ -z "$v" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          if [ -z "$v" ]; then v="0.0.0-dev+${GITHUB_SHA::7}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then echo "::error::bad version '$v'"; exit 1; fi
          echo "HIA_VERSION=$v" >> "$GITHUB_ENV"
          echo "HIA_LDFLAGS=-X github.com/caffeine-runtime/hold-it-all/internal/app.Version=$v" >> "$GITHUB_ENV"
          # The Windows installer needs a plain x.y.z product version.
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('wails.json'));j.info.productVersion=process.argv[1];fs.writeFileSync('wails.json',JSON.stringify(j,null,2)+'\n')" "${v%%[-+]*}"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          wails build -tags webkit2_41 -platform linux/amd64 -trimpath -ldflags "$HIA_LDFLAGS"
          go build -trimpath -ldflags "-X main.version=$HIA_VERSION" -o build/bin/holdit ./cmd/holdit
          mkdir -p stage/hold-it-all dist
          cp build/bin/hold-it-all build/bin/holdit build/linux/hold-it-all.desktop build/linux/hold-it-all-peek.desktop build/linux/install.sh stage/hold-it-all/
          cp build/appicon.png stage/hold-it-all/hold-it-all.png
          tar -C stage -czf dist/hold-it-all-linux-amd64.tar.gz hold-it-all

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) { choco install nsis -y --no-progress }
            "${env:ProgramFiles(x86)}\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append
            $env:PATH = "${env:ProgramFiles(x86)}\NSIS;$env:PATH"
          }
          New-Item -ItemType Directory -Force build/bin | Out-Null
          go build -trimpath -ldflags "-X main.version=$env:HIA_VERSION" -o build/bin/holdit.exe ./cmd/holdit
          wails build -platform windows/amd64 -nsis -trimpath -o hold-it-all.exe -ldflags "$env:HIA_LDFLAGS"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/bin/hold-it-all-amd64-installer.exe dist/
          Compress-Archive -Path build/bin/hold-it-all.exe,build/bin/holdit.exe -DestinationPath dist/hold-it-all-windows-amd64-portable.zip

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          wails build -platform darwin/universal -trimpath -ldflags "$HIA_LDFLAGS"
          for a in amd64 arm64; do GOOS=darwin GOARCH=$a go build -trimpath -ldflags "-X main.version=$HIA_VERSION" -o "build/holdit-$a" ./cmd/holdit; done
          lipo -create -output "build/bin/Hold It All.app/Contents/MacOS/holdit" build/holdit-amd64 build/holdit-arm64
          mkdir -p dist
          ditto -c -k --keepParent "build/bin/Hold It All.app" dist/hold-it-all-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: hold-it-all-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [selftest, build]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -la
          find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS . && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          SKIP_MACOS: ${{ inputs.skip_macos == true }}
        run: |
          v="$INPUT_VERSION"
          [ -z "$v" ] && v="${GITHUB_REF#refs/tags/v}"
          flags=()
          case "$v" in *-*) flags+=(--prerelease) ;; esac
          sed "s/{{VERSION}}/$v/g" .github/release-notes.md > notes.md
          if [ "$SKIP_MACOS" = true ]; then
            sed -i '/macos-universal/d' notes.md
            printf '\n**No macOS package in this release** — use the previous release on macOS.\n' >> notes.md
          fi
          gh release create "v$v" $(find dist -maxdepth 1 -type f | sort) --target "$GITHUB_SHA" --title "Hold It All $v" --notes-file notes.md --generate-notes "${flags[@]}"
