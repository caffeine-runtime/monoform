name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish a GitHub release with this version (e.g. 1.1.0 or 1.1.0-beta.1). Empty: build only."
        required: false
        default: ""
      skip_macos:
        description: "Leave out the macOS package (e.g. when no macOS runner is available)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  WAILS_VERSION: v2.17.0
  NODE_VERSION: "22"

jobs:
  check:
    name: Checks (types, unit tests, licenses)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System packages (WebKitGTK 4.1)
        # libheif tools: a system HEIC decoder for the conversion test (users install their own; nothing is bundled).
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libheif-examples libheif-plugin-libde265
      - name: Frontend install
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npm run check
      - name: Frontend unit tests
        working-directory: frontend
        run: npm test
      - name: Frontend build (embedded into the Go binary)
        working-directory: frontend
        run: npm run build
      - name: Go vet and tests
        run: |
          go vet -tags webkit2_41 ./...
          go test -tags webkit2_41 ./...
      - name: Model runtime (download from NuGet with the app's code, run a tiny model)
        run: MF_AI_NET=1 go test -tags webkit2_41 ./internal/ai -run DownloadRuntime -v
      - name: License audit (permissive only)
        run: |
          go build -tags webkit2_41 -o /tmp/monoform .
          python3 scripts/licenses.py /tmp/monoform

  selftest:
    name: In-app self-tests (Linux, Xvfb)
    runs-on: ubuntu-24.04
    # A hung test must not hold a release for hours (the whole run takes ~5 minutes).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gstreamer1.0-plugins-good xvfb openbox qpdf poppler-utils p7zip-full unzip libheif-examples libheif-plugin-libde265 scrot
      - name: Build
        run: |
          go install "github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}"
          (cd frontend && npm ci)
          ./scripts/build.sh
      - name: Self-tests
        run: |
          FX=$RUNNER_TEMP/fx
          python3 scripts/fixtures.py "$FX"
          M0=$RUNNER_TEMP/m0 && mkdir -p "$M0" && printf a >"$M0/a.txt" && printf b >"$M0/b.md" && printf c >"$M0/c.txt"
          scripts/selftest.sh m0-setup "$M0" "$RUNNER_TEMP/m0.json"
          scripts/selftest.sh m0-restore "$M0" "$RUNNER_TEMP/m0.json"
          for s in m1 m2 m3 m4 m4b m5 m6 m8 m10 m11 m12 m13 m14 m15 m16 m18 m19 m20 m21 m22 m23 m24 m25 m26 m27 m28 m29 m30 m31 m32 m33 m34 m35 m36 m37 m38 m39 m40 m42 m44 m45 m46 m48 m50 m51 m52 m53 m54 m55 m56 m57 m58 m59 m60 m61 m62 m63 m64 m65 m66 m67 m68 m69 m70 m71 m72 m73 m74 m75 m76 m78 m79 m80 m81; do scripts/selftest.sh "$s" "$FX"; done
          # The interface in Polish and Spanish, picked from the system language.
          MF_SYSTEM_LANG=pl-PL scripts/selftest.sh m47 "$FX"
          MF_SYSTEM_LANG=es-ES scripts/selftest.sh m47 "$FX"
          MF_SYSTEM_LANG=de-DE scripts/selftest.sh m47 "$FX"
          MF_SYSTEM_LANG=fr-FR scripts/selftest.sh m47 "$FX"
          # Quick peek: started with --peek FILE.
          scripts/selftest.sh m32peek "$FX" "" --peek "$FX/diagrams/notes.md"
          # Convert with Monoform (a file manager's right-click menu): started with --convert FILE….
          scripts/selftest.sh m82 "$FX" "" --convert "$FX/convert/photo.png" "$FX/convert/sales.csv"
          MF_AI_FAKE=1 MF_CACHE="$(mktemp -d)" scripts/selftest.sh m43 "$FX"
          # Updates: a made-up newer release, installed by logging (the real path is Go-tested).
          MF_UPDATE_FAKE=1 MF_CACHE="$(mktemp -d)" scripts/selftest.sh m49 "$FX"
          # The Microsoft Store build: no update check, the Store keeps it up to date.
          MF_STORE_FAKE=1 scripts/selftest.sh m77 "$FX"
          MF_TIMEOUT=400 scripts/selftest.sh m9 "$FX"
          # Pointer maths with a scaled interface (rows and controls at 125 %).
          python3 scripts/fixtures.py "$RUNNER_TEMP/fx125" && echo '{"uiScale":1.25}' > "$RUNNER_TEMP/scale.json" && scripts/selftest.sh m14 "$RUNNER_TEMP/fx125" "$RUNNER_TEMP/scale.json"
          scripts/verify-pdf.sh "$FX"
          scripts/verify-archives.sh "$FX"
          scripts/verify-images.sh "$FX"
          scripts/verify-ocr.sh "$FX"
          # The setup program, as its Linux demo (installs into a test folder through its window).
          scripts/setup-selftest.sh

  build:
    name: Package (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        name: [linux-amd64, windows-amd64, macos-universal]
        # skip_macos drops that job entirely (no macOS runner is requested).
        exclude:
          - name: ${{ inputs.skip_macos == true && 'macos-universal' || 'none' }}
    runs-on: ${{ fromJSON('{"linux-amd64":"ubuntu-24.04","windows-amd64":"windows-latest","macos-universal":"macos-latest"}')[matrix.name] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}
      - name: Version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$INPUT_VERSION"
          if [ -z "$v" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; fi
          if [ -z "$v" ]; then v="0.0.0-dev+${GITHUB_SHA::7}"; fi
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$ ]]; then echo "::error::bad version '$v'"; exit 1; fi
          echo "MF_VERSION=$v" >> "$GITHUB_ENV"
          echo "MF_LDFLAGS=-X github.com/caffeine-runtime/monoform/internal/app.Version=$v" >> "$GITHUB_ENV"
          # The Windows installer needs a plain x.y.z product version.
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('wails.json'));j.info.productVersion=process.argv[1];fs.writeFileSync('wails.json',JSON.stringify(j,null,2)+'\n')" "${v%%[-+]*}"

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          wails build -tags webkit2_41 -platform linux/amd64 -trimpath -ldflags "$MF_LDFLAGS"
          mkdir -p stage/monoform dist
          cp build/bin/monoform build/linux/monoform.desktop build/linux/monoform-peek.desktop build/linux/monoform-convert.desktop build/linux/monoform-convert-servicemenu.desktop build/linux/install.sh stage/monoform/
          cp build/appicon.png stage/monoform/monoform.png
          tar -C stage -czf dist/monoform-linux-amd64.tar.gz monoform

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/bin | Out-Null
          go build -trimpath -ldflags "-X main.version=$env:MF_VERSION" -o build/bin/monoform-cli.exe ./cmd/monoform-cli
          wails build -platform windows/amd64 -trimpath -o monoform.exe -ldflags "$env:MF_LDFLAGS"
          # Our own setup program (cmd/setup) with the app inside.
          npm --prefix frontend run build:setup
          go run ./cmd/setup/pack build/bin/monoform.exe build/bin/monoform-cli.exe @((Get-ChildItem build/windows/file-*.ico).FullName)
          Copy-Item build/windows/icon.ico cmd/setup/build/windows/icon.ico
          $v = $env:MF_VERSION -replace '[-+].*$', ''
          node -e "const fs=require('fs');const p='cmd/setup/wails.json';const j=JSON.parse(fs.readFileSync(p));j.info.productVersion=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')" "$v"
          Push-Location cmd/setup
          wails build -platform windows/amd64 -s -skipbindings -webview2 embed -trimpath -o monoform-amd64-installer.exe -ldflags "-X main.version=$env:MF_VERSION"
          Pop-Location
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item cmd/setup/build/bin/monoform-amd64-installer.exe dist/
          Compress-Archive -Path build/bin/monoform.exe,build/bin/monoform-cli.exe -DestinationPath dist/monoform-windows-amd64-portable.zip

      - name: Model runtime (Windows DLL loading, wide-char model paths)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MF_AI_NET = '1'
          go test ./internal/ai -run DownloadRuntime -v

      - name: Setup program (Windows, quiet install and uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'Monoform'
          $log = Join-Path $env:TEMP 'monoform-setup.log'
          $p = Start-Process dist/monoform-amd64-installer.exe -ArgumentList '--quiet','--dir',"`"$dir`"",'--desktop','--defaults' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install exited $($p.ExitCode): $(Get-Content $log -ErrorAction SilentlyContinue)" }
          foreach ($f in 'monoform.exe','monoform-cli.exe','file-text.ico','file-image.ico','uninstall.exe') { if (-not (Test-Path (Join-Path $dir $f))) { throw "$f not installed" } }
          $u = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Monoform'
          if ($u.DisplayVersion -ne $env:MF_VERSION) { throw "uninstall entry version '$($u.DisplayVersion)'" }
          if ((Get-ItemProperty 'HKCU:\Software\Classes\.md').'(default)' -ne 'Monoform.md') { throw '.md not associated' }
          if ((Get-ItemProperty 'HKCU:\Software\Classes\Monoform.png\DefaultIcon').'(default)' -notlike '*file-image.ico') { throw 'png has no picture icon' }
          if ((Get-ItemProperty 'HKCU:\Software\Classes\Monoform.png\shell\open\command').'(default)' -notlike '*--peek*') { throw 'png does not open in quick view' }
          if ((Get-ItemProperty 'HKCU:\Software\Classes\SystemFileAssociations\.docx\shell\Monoform.Convert\command').'(default)' -notlike '*--convert*') { throw 'no Convert with Monoform on .docx' }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Monoform.lnk'))) { throw 'no Start menu shortcut' }
          if (-not (Test-Path "$env:LOCALAPPDATA\Microsoft\WindowsApps\monoform.cmd")) { throw 'no monoform command' }
          & (Join-Path $dir 'monoform-cli.exe') version
          $p = Start-Process (Join-Path $dir 'uninstall.exe') -ArgumentList '--uninstall','--quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exited $($p.ExitCode): $(Get-Content $log -ErrorAction SilentlyContinue)" }
          # The uninstaller may only go (with the folder) after it exits.
          for ($i = 0; $i -lt 30 -and (Test-Path $dir); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $dir) { throw "folder left after uninstall: $((Get-ChildItem $dir).Name -join ', ')" }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Monoform') { throw 'uninstall entry left' }
          if (Test-Path 'HKCU:\Software\Classes\Monoform.md') { throw 'file class left' }
          if (Test-Path 'HKCU:\Software\Classes\SystemFileAssociations\.docx\shell\Monoform.Convert') { throw 'convert verb left' }
          if (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'Monoform.lnk')) { throw 'shortcut left' }
          "setup: quiet install and uninstall OK"

      # The Microsoft Store package: the same app (it sees it runs packaged and leaves
      # updates to the Store), packed with makeappx; the Store signs it. Its identity
      # comes from Partner Center through repository variables (MSIX_*), with
      # stand-ins until they are set. Not a release file: users can't install an
      # unsigned package; upload it in Partner Center from this run's artifacts.
      - name: Microsoft Store package (Windows, MSIX)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'Monoform.Dev' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Monoform Dev' }}
          MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME || 'Monoform' }}
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory -Filter '10.*' | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $kit = Join-Path $sdk.FullName 'x64'
          "Windows SDK tools: $kit"
          $stage = Join-Path $env:RUNNER_TEMP 'msix'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item build/bin/monoform.exe $stage
          Copy-Item -Recurse build/windows/msix/Assets (Join-Path $stage 'Assets')
          go run ./cmd/msix -version $env:MF_VERSION -name $env:MSIX_NAME -publisher $env:MSIX_PUBLISHER -publisher-name $env:MSIX_PUBLISHER_NAME -o (Join-Path $stage 'AppxManifest.xml')
          if ($LASTEXITCODE) { throw 'manifest' }
          # resources.pri: lets Windows pick the logo variant for each size and scale.
          $cfg = Join-Path $env:RUNNER_TEMP 'priconfig.xml'
          & (Join-Path $kit 'makepri.exe') createconfig /cf $cfg /dq en-US /pv 10.0.0 /o
          if ($LASTEXITCODE) { throw 'makepri createconfig' }
          & (Join-Path $kit 'makepri.exe') new /pr $stage /cf $cfg /mn (Join-Path $stage 'AppxManifest.xml') /of (Join-Path $stage 'resources.pri') /o
          if ($LASTEXITCODE) { throw 'makepri new' }
          New-Item -ItemType Directory -Force store | Out-Null
          & (Join-Path $kit 'makeappx.exe') pack /d $stage /p store/monoform-store-x64.msix /o
          if ($LASTEXITCODE) { throw 'makeappx' }

      - name: Microsoft Store package (Windows, test install)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSIX_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'Monoform.Dev' }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=Monoform Dev' }}
        run: |
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Directory -Filter '10.*' | Sort-Object { [version]$_.Name } | Select-Object -Last 1
          $kit = Join-Path $sdk.FullName 'x64'
          # A throwaway certificate with the package's publisher, trusted on this runner only.
          $cert = New-SelfSignedCertificate -Type Custom -Subject $env:MSIX_PUBLISHER -KeyUsage DigitalSignature -FriendlyName 'Monoform MSIX test' -CertStoreLocation 'Cert:\CurrentUser\My' -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $pfx = Join-Path $env:RUNNER_TEMP 'msix-test.pfx'
          $pw = ConvertTo-SecureString -String 'test' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $pw | Out-Null
          $test = Join-Path $env:RUNNER_TEMP 'monoform-test.msix'
          Copy-Item store/monoform-store-x64.msix $test
          & (Join-Path $kit 'signtool.exe') sign /fd SHA256 /f $pfx /p test $test
          if ($LASTEXITCODE) { throw 'signtool' }
          Add-AppxPackage -Path $test
          $p = Get-AppxPackage -Name $env:MSIX_NAME
          if (-not $p) { throw 'not installed' }
          $want = ($env:MF_VERSION -replace '[-+].*$', '') + '.0'
          if ($p.Version -ne $want) { throw "package version $($p.Version), want $want" }
          # The monoform command, through its execution alias (the app itself, a GUI program: wait for it).
          $alias = Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps\monoform.exe'
          if (-not (Test-Path $alias)) { throw 'no monoform alias' }
          $out = Join-Path $env:RUNNER_TEMP 'monoform-version.txt'
          $v = Start-Process $alias -ArgumentList 'version' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out
          if ($v.ExitCode) { throw "monoform version exited $($v.ExitCode)" }
          $text = Get-Content -Raw $out
          if ($text -notmatch [regex]::Escape("Monoform $env:MF_VERSION")) { throw "monoform version printed '$text'" }
          $text
          # The app starts inside the package and stays up.
          Start-Process "shell:AppsFolder\$($p.PackageFamilyName)!Monoform"
          Start-Sleep -Seconds 10
          $proc = Get-Process monoform -ErrorAction SilentlyContinue
          if (-not $proc) { throw 'the packaged app did not start (or quit)' }
          $proc | Stop-Process -Force
          Remove-AppxPackage -Package $p.PackageFullName
          if (Get-AppxPackage -Name $env:MSIX_NAME) { throw 'still installed' }
          "msix: signed test install, monoform command, app start and removal OK"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: store-msix
          path: store/*
          if-no-files-found: error

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          wails build -platform darwin/universal -trimpath -ldflags "$MF_LDFLAGS"
          for a in amd64 arm64; do GOOS=darwin GOARCH=$a go build -trimpath -ldflags "-X main.version=$MF_VERSION" -o "build/monoform-cli-$a" ./cmd/monoform-cli; done
          lipo -create -output "build/bin/Monoform.app/Contents/MacOS/monoform-cli" build/monoform-cli-amd64 build/monoform-cli-arm64
          mkdir -p dist
          ditto -c -k --keepParent "build/bin/Monoform.app" dist/monoform-macos-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: monoform-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [selftest, build]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: monoform-*
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          ls -la
          find . -maxdepth 1 -type f -printf '%f\n' | sort | xargs sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS . && cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          SKIP_MACOS: ${{ inputs.skip_macos == true }}
        run: |
          v="$INPUT_VERSION"
          [ -z "$v" ] && v="${GITHUB_REF#refs/tags/v}"
          flags=()
          case "$v" in *-*) flags+=(--prerelease) ;; esac
          sed "s/{{VERSION}}/$v/g" .github/release-notes.md > notes.md
          if [ "$SKIP_MACOS" = true ]; then
            sed -i '/macos-universal/d' notes.md
            printf '\n**No macOS package in this release** — use the previous release on macOS.\n' >> notes.md
          fi
          gh release create "v$v" $(find dist -maxdepth 1 -type f | sort) --target "$GITHUB_SHA" --title "Monoform $v" --notes-file notes.md --generate-notes "${flags[@]}"
