name: Clean up runs

# One-off (removed after it has run): deletes every finished workflow run
# created before the 1.1.0 release run, with its logs and artifacts. A run
# can't delete itself, so this one's own entry is left (delete it by hand).
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the earlier runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: "2026-10-22T11:49:50Z"
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            -q ".workflow_runs[] | select(.status == \"completed\" and .created_at < \"$BEFORE\") | .id")
          n=0
          for id in $ids; do
            gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null && n=$((n + 1))
          done
          echo "deleted $n runs created before $BEFORE"
          echo "left:"; gh api --paginate "repos/$REPO/actions/runs?per_page=100" -q '.workflow_runs[] | "\(.created_at) \(.name) \(.status)"'
