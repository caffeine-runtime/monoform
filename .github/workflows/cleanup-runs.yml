name: Delete old workflow runs (one-off)
on:
  workflow_dispatch:
    inputs:
      before:
        description: 'Delete runs created before this time (UTC, ISO 8601)'
        required: true
      keep:
        description: 'Space-separated run IDs to keep'
        required: false
        default: ''
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ inputs.before }}
          KEEP: ${{ inputs.keep }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq ".workflow_runs[] | select(.created_at < \"$BEFORE\") | .id")
          for id in $ids; do
            if [[ " $KEEP " == *" $id "* || "$id" == "$GITHUB_RUN_ID" ]]; then echo "keep $id"; continue; fi
            gh api -X DELETE "repos/$REPO/actions/runs/$id" && echo "deleted $id"
          done
