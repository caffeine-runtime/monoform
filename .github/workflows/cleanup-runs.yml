name: Clean up workflow runs

# One-off: deletes every finished workflow run (logs and artifacts). Runs still
# queued or in progress are left alone; published releases are not affected.
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete finished runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          set -euo pipefail
          deleted=0
          for id in $(gh api "repos/$REPO/actions/runs?status=completed&per_page=100" --paginate --jq '.workflow_runs[].id'); do
            [ "$id" = "$SELF" ] && continue
            gh api -X DELETE "repos/$REPO/actions/runs/$id" && deleted=$((deleted + 1))
          done
          echo "Deleted $deleted finished runs."
